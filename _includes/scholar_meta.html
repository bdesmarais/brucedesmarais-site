<meta name="citation_title" content="{{ page.title | escape }}">
{% for a in page.authors %}<meta name="citation_author" content="{{ a | escape }}">
{% endfor %}{% if page.year and page.status == nil %}<meta name="citation_publication_date" content="{{ page.year }}">{% endif %}
{% if page.kind == 'article' %}<meta name="citation_journal_title" content="{{ page.venue | escape }}">{% elsif page.kind == 'proceedings' %}<meta name="citation_conference_title" content="{{ page.venue | escape }}">{% endif %}
{% if page.volume %}<meta name="citation_volume" content="{{ page.volume }}">{% endif %}
{% if page.number %}<meta name="citation_issue" content="{{ page.number }}">{% endif %}
{% if page.doi %}<meta name="citation_doi" content="{{ page.doi }}">{% endif %}
