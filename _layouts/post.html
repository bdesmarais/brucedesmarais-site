---
layout: default
---
<article class="wrap page post">
  <p class="eyebrow"><a href="{{ '/news/' | relative_url }}">News</a> · {{ page.date | date: "%B %-d, %Y" }}</p>
  <h1>{{ page.title }}</h1>
  {{ content }}
  {% if page.linkedin %}{% include linkedin.html id=page.linkedin topic=page.title %}{% endif %}
</article>
