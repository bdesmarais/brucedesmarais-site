students:
  - name: Lingyu (Jack) Fuca
    role: Ph.D. student, Political Science
    photo: jack.jpeg
    bio: Estimates causal effects in complex social networks, combining causal inference, network analysis, machine learning and formal theory to separate social influence from homophily.
  - name: Kadir Cihan Duran
    role: Ph.D. candidate, Political Science and Social Data Analytics
    photo: cihan.jpg
    bio: Studies competitive authoritarian regimes and social media, using network analysis, deep neural networks and natural language processing.
  - name: Jody Park
    role: Ph.D. student, Political Science
    photo: jody.jpg
    url: https://jodypark.github.io
    bio: Studies racial and ethnic diversity in U.S. federal agencies and how it shapes agency ideology and institutional outcomes, using administrative data.
  - name: Nicholas Hemauer
    role: Ph.D. candidate, Political Science and Social Data Analytics
    photo: nick.jpeg
    url: https://nickhemauer.com
    bio: Studies policy diffusion, state public health policy and political misinformation, including how firearm mortality shapes the adoption of firearm regulations.
  - name: Connor Stitt
    role: Ph.D. student, Political Science
    photo: connor.jpg
    url: https://connormstitt.github.io/
    bio: Estimates elite and mass ideology with tools from computational neuroscience and network analysis.
  - name: Yue (Emily) Wang
    role: Ph.D. student, Political Science
    bio: Joined the lab in fall 2026.
